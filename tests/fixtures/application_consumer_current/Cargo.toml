[package]
name = "ioc-downstream-consumer-current"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "ioc_application_consumer"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/src/lib.rs"

[[bin]]
name = "ioc-downstream-consumer-current"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/src/main.rs"

[dependencies]
qubit-ioc = { path = "../../..", version = "0.3.0" }
qubit-execution-services = { path = "../../../../rs-execution-services", version = "0.10" }
qubit-event-bus = { path = "../../../../rs-event-bus", version = "0.18.0" }
qubit-fs-registry = { path = "../../../../rs-fs-registry", version = "0.7" }
qubit-fs-local = { path = "../../../../rs-fs-local", version = "0.10", features = ["registry"] }
qubit-fs = { path = "../../../../rs-fs", version = "0.2" }
tempfile = "3"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync"] }

[[test]]
name = "application_lifecycle_tests"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/tests/application_lifecycle_tests.rs"

[[test]]
name = "resource_integration_tests"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/tests/resource_integration_tests.rs"

[[test]]
name = "managed_event_bus_tests"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/tests/managed_event_bus_tests.rs"

[[test]]
name = "shutdown_policy_tests"
path = "../../../../rs-execution-services/tests/fixtures/ioc_application_consumer/tests/shutdown_policy_tests.rs"

[patch.crates-io]
qubit-fs-registry = { path = "../../../../rs-fs-registry" }
qubit-fs = { path = "../../../../rs-fs" }
