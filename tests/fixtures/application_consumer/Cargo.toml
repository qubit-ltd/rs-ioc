[package]
name = "ioc-downstream-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "ioc_application_consumer"
path = "src/lib.rs"

[[bin]]
name = "ioc-downstream-consumer"
path = "src/main.rs"

[dependencies]
qubit-ioc = { path = "../../../", version = "^0.4" }
qubit-execution-services = { version = "^0.11" }
qubit-event-bus = { version = "^0.21" }
qubit-fs-registry = { version = "^0.8" }
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync"] }
