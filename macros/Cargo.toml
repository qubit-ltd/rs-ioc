[package]
name = "qubit-ioc-macros"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-ioc"
description = "Procedural macros for qubit-ioc"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "^1.0"
proc-macro-crate = "^3.5"
quote = "^1.0"
syn = { version = "^3.0", features = ["full"] }
