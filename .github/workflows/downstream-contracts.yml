name: Downstream contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-services-consumer-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-ioc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-execution-services
          ref: db0ab6cde710596add3b04142f2dd5045b0a081b
          path: rs-execution-services
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-event-bus
          ref: 563552b58fe5cfa93f0f4f4295e7ca4e70911be1
          path: rs-event-bus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-config
          ref: 68a331501cdd7911964dd2399e6fc0aee39f8527
          path: rs-config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: d3a6cacbc05bea970175db9cf6211680aa39c87c
          path: rs-fs-registry
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Record exact source revisions
        run: |
          git -C rs-ioc rev-parse HEAD
          git -C rs-execution-services rev-parse HEAD
          git -C rs-event-bus rev-parse HEAD
          git -C rs-config rev-parse HEAD
          git -C rs-fs-registry rev-parse HEAD
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version
          sha256sum "$(rustup which --toolchain 1.94.0 rustc)"
          sha256sum rs-ioc/tests/fixtures/application_consumer/Cargo.lock
          sha256sum rs-ioc/tests/fixtures/application_consumer/src/*.rs rs-ioc/tests/fixtures/application_consumer/tests/*.rs
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/src/main.rs
      - name: Check downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 check --manifest-path tests/fixtures/application_consumer/Cargo.toml --locked
      - name: Test downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 test --manifest-path tests/fixtures/application_consumer/Cargo.toml --locked
      - name: Run downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 run --manifest-path tests/fixtures/application_consumer/Cargo.toml --locked

  execution-services-consumer-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-ioc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-execution-services
          ref: cdf305ac72e437f6d3019b86dd44ad199ecdb374
          path: rs-execution-services
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-event-bus
          ref: fbb39e496bb166351a929ab3ceac2ffeddd37f12
          path: rs-event-bus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-config
          ref: 2958c1d1f1f3e1ac257a26bbad10be740b373fd4
          path: rs-config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: 6f4e8fcb9407152dffa9ff65b32fdf02f46bfc05
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: 8998cb0c4d9a314e62e025a3e5adc36bf0bca301
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: 6fc76f0b3dd0d7795d000c11cac749a3791402c2
          path: rs-fs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-redact
          ref: 133954d6d24ed831f5133f2bd3d42a554f5e52ad
          path: rs-redact
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: d4235f2dcfa34cf09ea1bf49ba4fe70bb4307c89
          path: rs-local-files
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-testkit
          ref: b9425fec4cd142826f95cede3715db57b82d8b08
          path: rs-fs-testkit
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Test downstream contract documentation checker
        working-directory: rs-ioc
        run: python3 -m unittest discover -s .infra/tools/tests -p 'test_check_downstream_contract_docs.py' -v
      - name: Check downstream contract documentation
        working-directory: rs-ioc
        run: python3 .infra/tools/check-downstream-contract-docs.py
      - name: Record exact source revisions
        run: |
          git -C rs-ioc rev-parse HEAD
          git -C rs-execution-services rev-parse HEAD
          git -C rs-event-bus rev-parse HEAD
          git -C rs-config rev-parse HEAD
          git -C rs-fs-registry rev-parse HEAD
          git -C rs-fs-local rev-parse HEAD
          git -C rs-fs rev-parse HEAD
          git -C rs-redact rev-parse HEAD
          git -C rs-local-files rev-parse HEAD
          git -C rs-fs-testkit rev-parse HEAD
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version
          sha256sum "$(rustup which --toolchain 1.94.0 rustc)"
          sha256sum rs-ioc/tests/fixtures/application_consumer_current/Cargo.lock
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/Cargo.lock
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/src/*.rs
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/tests/*.rs rs-execution-services/tests/fixtures/ioc_application_consumer/tests/internal/*.rs
      - name: Verify current consumer IoC feature isolation
        working-directory: rs-ioc
        run: python3 .infra/tools/check-manual-feature-isolation.py --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --package ioc-downstream-consumer-current
      - name: Check downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 check --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
      - name: Test downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 test --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
      - name: Run downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 run --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
      - name: Test downstream native consumer with its locked dependencies
        working-directory: rs-execution-services
        run: cargo +1.94.0 test --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
