name: IoC Consumer Contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macro-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test proc macro crate directly
        run: cargo +1.94.0 test -p qubit-ioc-macros --locked

  macro-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test proc macro coverage gate
        run: python3 -m unittest discover -s .infra/tools/tests -p 'test_check_macro_coverage.py' -v
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect proc macro crate coverage
        env:
          CARGO_INCREMENTAL: "1"
        run: cargo +1.94.0 llvm-cov -p qubit-ioc-macros --all-features --locked --json --output-path target/qubit-ioc-macros-coverage.json
      - name: Check proc macro coverage minimums
        run: bash .infra/tools/check-macro-coverage.sh target/qubit-ioc-macros-coverage.json
      - name: Print coverage totals
        run: |
          ruby -rjson -e '
            totals = JSON.parse(File.read(ARGV.fetch(0))).fetch("data").first.fetch("totals")
            %w[functions lines regions].each do |metric|
              value = totals.fetch(metric)
              puts "#{metric}: #{value.fetch("covered")}/#{value.fetch("count")} (#{value.fetch("percent")}%)"
            end
          ' target/qubit-ioc-macros-coverage.json
      - name: Upload proc macro coverage report
        uses: actions/upload-artifact@v7
        with:
          name: qubit-ioc-macros-coverage
          path: target/qubit-ioc-macros-coverage.json
          retention-days: 14
          if-no-files-found: error

  macro-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer-features: ["", extra, config, "extra,config"]
    env:
      CONSUMER_FEATURES: ${{ matrix.consumer-features }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test consumer without optional features
        if: env.CONSUMER_FEATURES == ''
        run: cargo +1.94.0 test --manifest-path tests/fixtures/macro_contracts/Cargo.toml --locked
      - name: Test consumer feature combination
        if: env.CONSUMER_FEATURES != ''
        run: cargo +1.94.0 test --manifest-path tests/fixtures/macro_contracts/Cargo.toml --features "$CONSUMER_FEATURES" --locked
      - name: Run same-package declarative example
        run: cargo +1.94.0 run --example readme_declarative --no-default-features --features macros --locked

  managed-paths:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path-kind: [canonical, renamed, keyword]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test managed paths
        run: cargo +1.94.0 test --manifest-path tests/fixtures/managed_paths/${{ matrix.path-kind }}/Cargo.toml --locked

  assembly-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Test cross-crate provider assembly
        run: cargo +1.94.0 test --manifest-path tests/fixtures/ioc_cross_crate/Cargo.toml -p qubit-ioc-fixture-app --locked
      - name: Test feature-minimal manual assembly
        run: cargo +1.94.0 test --manifest-path tests/fixtures/ioc_cross_crate/Cargo.toml -p qubit-ioc-fixture-manual --locked
      - name: Verify manual consumer feature isolation
        run: |
          python3 -m unittest discover -s .infra/tools/tests -p 'test_check_manual_feature_isolation.py' -v
          python3 .infra/tools/check-manual-feature-isolation.py
      - name: Run managed lifecycle example
        run: cargo +1.94.0 run --example app_lifecycle --no-default-features --locked
