[workspace]
members = [".", "macros"]
resolver = "3"

[package]
name = "qubit-ioc"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-ioc"
homepage = "https://qubit-ltd.github.io/rs-ioc/"
description = "Application-level component assembly and sharing for Rust applications"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/CHANGELOG.md",
    "/examples/readme_declarative.rs",
    "/examples/readme_manual.rs",
    "/examples/readme_beans.rs",
    "/examples/app_lifecycle.rs",
    "/examples/config_contract.rs",
    "/examples/context_sharing.rs",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_ioc"

[[example]]
name = "readme_declarative"
required-features = ["macros"]

[[example]]
name = "readme_beans"
required-features = ["macros"]

[[example]]
name = "config_contract"
required-features = ["config"]

[[example]]
name = "context_sharing"

[features]
default = ["macros", "config"]
macros = ["dep:qubit-ioc-macros"]
config = ["dep:qubit-config", "dep:serde"]

[dependencies]
thiserror = "2.0"
qubit-ioc-macros = { path = "macros", version = "0.2.0", optional = true }
qubit-config = { version = "0.14.3", optional = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
trybuild = "1.0"
qubit-spi = "0.13.0"
tokio = { version = "1.53", features = ["rt", "sync"] }
