[workspace]
members = [".", "macros"]
resolver = "3"

[package]
name = "qubit-ioc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-ioc"
homepage = "https://qubit-ltd.github.io/rs-ioc/"
description = "Application-level component assembly and sharing for Rust applications"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_ioc"

[features]
default = ["macros", "inventory", "config"]
macros = ["dep:qubit-ioc-macros"]
inventory = ["dep:inventory"]
config = ["dep:qubit-config", "dep:serde"]
reflect = []

[dependencies]
thiserror = "2.0"
qubit-ioc-macros = { path = "macros", version = "0.1.0", optional = true }
inventory = { version = "0.3", optional = true }
qubit-config = { version = "0.14.3", optional = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
trybuild = "1.0"
qubit-spi = "0.13.0"
